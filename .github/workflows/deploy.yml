name: Daily Benchmark Update & Pages Deploy

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
  workflow_dispatch:
    # Allows manual execution anytime via GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Latest Benchmarks from Multi-Tier Sources
        env:
          # Ingest model names from GitHub Repository Variable vars.MODEL_NAMES
          MODEL_NAMES: ${{ vars.MODEL_NAMES }}
          # Fallback or supplementary URLs
          MODEL_URLS: ${{ vars.MODEL_URLS }}
        run: |
          node scripts/update_benchmarks.js

      - name: Commit & push updated benchmark data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): auto-update benchmarks from model cards [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
